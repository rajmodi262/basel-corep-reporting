name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Regenerate the synthetic books and check they match the committed ones
        run: |
          python scripts/generate_bank.py
          git diff --exit-code data/
      - name: Build, reconcile and validate the report (fails on any EBA rule failure)
        run: python -m corep.pipeline
      - name: EBA rules on 120 real banks (CR-003)
        run: python -m corep.transparency
      - name: Tests
        run: python -m pytest -q
